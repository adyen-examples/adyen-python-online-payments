# Transact project manifest.
#
# Upstream ships a requirements.txt with an unpinned Flask. Transact does not use it.
# A quality platform that cannot reproduce its own environment cannot make claims
# about anything else, so every runtime dependency is pinned here instead.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transact"
version = "0.1.0"
description = "Payment API quality engineering platform built around the Adyen Python online payments example"
requires-python = ">=3.10"

dependencies = [
    "Flask==3.1.3",
    "Adyen==13.3.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
# Test tooling is added phase by phase, as each tool earns its place.
dev = []

[tool.setuptools]
# Transact is an application, not a library. Nothing here is meant to be
# importable from site-packages, so no packages are installed.
packages = []
